<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" style="background:#090d16; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#06090f"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="coreActiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="coreIsoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Circuit & Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350"/>
    <path d="M 150,0 L 150,420 M 300,0 L 300,420 M 450,0 L 450,420 M 600,0 L 600,420 M 750,0 L 750,420 M 900,0 L 900,420 M 1050,0 L 1050,420"/>
  </g>

  <!-- Glowing Accent Lines -->
  <path d="M 0,0 L 350,0 L 420,70 L 1200,70" fill="none" stroke="url(#cyanNeon)" stroke-width="2" opacity="0.8" filter="url(#neonGlow)"/>
  <path d="M 0,420 L 780,420 L 850,350 L 1200,350" fill="none" stroke="url(#purpleNeon)" stroke-width="2" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Brand Title -->
  <text x="60" y="80" fill="#00f2fe" font-size="14" font-weight="700" letter-spacing="3" text-transform="uppercase">Windows NT Kernel Performance Tuning</text>
  <text x="60" y="130" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="1">NoCore0 Gaming Optimizer</text>
  <text x="60" y="165" fill="#94a3b8" font-size="18" font-weight="400">Zero Background Overhead • 100% Native IFEO Registry • Eliminates Micro-Stutters</text>

  <!-- Telemetry Badges -->
  <g transform="translate(60, 195)">
    <!-- Badge 1: 0% Overhead -->
    <rect x="0" y="0" width="160" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#10b981"/>
    <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="600">0% RAM / CPU Cost</text>

    <!-- Badge 2: Anti-Cheat Safe -->
    <rect x="175" y="0" width="170" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="193" cy="17" r="5" fill="#00f2fe"/>
    <text x="207" y="22" fill="#f8fafc" font-size="13" font-weight="600">VAC / EAC / VG Safe</text>

    <!-- Badge 3: 1% Low Boost -->
    <rect x="360" y="0" width="180" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="378" cy="17" r="5" fill="#f355da"/>
    <text x="392" y="22" fill="#f8fafc" font-size="13" font-weight="600">+15-25% 1% Low FPS</text>
  </g>

  <!-- Visual Architecture: CPU DIE SIMULATION (Right Side) -->
  <g transform="translate(670, 75)">
    <!-- CPU Package Outer -->
    <rect x="0" y="0" width="470" height="280" rx="14" fill="#0d1424" stroke="#25334d" stroke-width="2"/>
    <rect x="8" y="8" width="454" height="264" rx="10" fill="#080c16" stroke="#1e293b" stroke-width="1"/>

    <!-- Header on Die -->
    <text x="25" y="38" fill="#64748b" font-size="12" font-weight="700" letter-spacing="2">AMD RYZEN / HIGH PERFORMANCE CPU DIE MAP</text>

    <!-- CORE 0 (ISOLATED FOR OS) -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="95" height="180" rx="8" fill="url(#coreIsoGrad)" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 2"/>
      <text x="47" y="35" fill="#94a3b8" font-size="14" font-weight="700" text-anchor="middle">CORE 0</text>
      <text x="47" y="55" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">CPU 0 + 1</text>
      <path d="M 20,80 L 75,80" stroke="#475569" stroke-width="1"/>
      <text x="47" y="110" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">RESERVED</text>
      <text x="47" y="130" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Windows DPC</text>
      <text x="47" y="145" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Interrupts</text>
      <text x="47" y="160" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Audio &amp; Net</text>
    </g>

    <!-- CORES 1 TO 7 (TURBO GAMING CLUSTER) -->
    <g transform="translate(135, 60)">
      <!-- Cluster Outer -->
      <rect x="0" y="0" width="310" height="180" rx="8" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" filter="url(#neonGlow)" opacity="0.9"/>
      
      <!-- 7 Active Cores -->
      <!-- C1 -->
      <rect x="10" y="15" width="36" height="110" rx="4" fill="url(#coreActiveGrad)"/>
      <text x="28" y="75" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">C1</text>
      <!-- C2 -->
      <rect x="52" y="15" width="36" height="110" rx="4" fill="url(#coreActiveGrad)"/>
      <text x="70" y="75" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">C2</text>
      <!-- C3 -->
      <rect x="94" y="15" width="36" height="110" rx="4" fill="url(#coreActiveGrad)"/>
      <text x="112" y="75" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">C3</text>
      <!-- C4 -->
      <rect x="136" y="15" width="36" height="110" rx="4" fill="url(#coreActiveGrad)"/>
      <text x="154" y="75" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">C4</text>
      <!-- C5 -->
      <rect x="178" y="15" width="36" height="110" rx="4" fill="url(#coreActiveGrad)"/>
      <text x="196" y="75" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">C5</text>
      <!-- C6 -->
      <rect x="220" y="15" width="36" height="110" rx="4" fill="url(#coreActiveGrad)"/>
      <text x="238" y="75" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">C6</text>
      <!-- C7 -->
      <rect x="262" y="15" width="36" height="110" rx="4" fill="url(#coreActiveGrad)"/>
      <text x="280" y="75" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">C7</text>

      <!-- Label below cores -->
      <rect x="10" y="135" width="288" height="32" rx="4" fill="#1e293b"/>
      <text x="154" y="156" fill="#00f2fe" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">DEDICATED GAMING THREADS (MASK: 0xFFFC)</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#cyanNeon)"/>
</svg>
